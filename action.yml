name: robops — Roblox deployment
description: Builds and publishes a Roblox experience (places, metadata, DataStores) via Open Cloud.
author: robops

inputs:
  environment:
    description: robops.toml environment to deploy (e.g. staging, production)
    required: true
  api-key:
    description: Open Cloud API key (pass a secret). Not needed in dry-run.
    required: false
    default: ""
  config:
    description: Path of the configuration file
    required: false
    default: robops.toml
  version-type:
    description: "Override the version type: Published or Saved (empty = config)"
    required: false
    default: ""
  places:
    description: Names of the places to deploy, separated by spaces (empty = all)
    required: false
    default: ""
  with-datastores:
    description: Also overwrite the configured DataStores (true/false)
    required: false
    default: "false"
  restart:
    description: "Server restart: true, false or empty (= config)"
    required: false
    default: ""
  skip-build:
    description: Do not run the build command (true/false)
    required: false
    default: "false"
  dry-run:
    description: Build + checks without any call to Roblox (true/false)
    required: false
    default: "false"
  python-version:
    description: Python version to use (3.11 minimum)
    required: false
    default: "3.12"

outputs:
  versions:
    description: 'Published versions as JSON, e.g. {"main": 42}'
    value: ${{ steps.deploy.outputs.versions }}
  environment:
    description: Deployed environment
    value: ${{ steps.deploy.outputs.environment }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install robops
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Deploy
      id: deploy
      shell: bash
      # Inputs go through environment variables (no injection into the script).
      env:
        ROBLOX_API_KEY: ${{ inputs.api-key }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_CONFIG: ${{ inputs.config }}
        IN_VERSION_TYPE: ${{ inputs.version-type }}
        IN_PLACES: ${{ inputs.places }}
        IN_WITH_DATASTORES: ${{ inputs.with-datastores }}
        IN_RESTART: ${{ inputs.restart }}
        IN_SKIP_BUILD: ${{ inputs.skip-build }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=(deploy "$IN_ENVIRONMENT" --config "$IN_CONFIG")
        [ -n "$IN_VERSION_TYPE" ] && args+=(--version-type "$IN_VERSION_TYPE")
        for place in $IN_PLACES; do args+=(--place "$place"); done
        [ "$IN_WITH_DATASTORES" = "true" ] && args+=(--with-datastores)
        [ "$IN_RESTART" = "true" ] && args+=(--restart)
        [ "$IN_RESTART" = "false" ] && args+=(--no-restart)
        [ "$IN_SKIP_BUILD" = "true" ] && args+=(--skip-build)
        [ "$IN_DRY_RUN" = "true" ] && args+=(--dry-run)
        robops "${args[@]}"
