# ─────────────────────────────────────────────────────────────────────────────
#  Player data backup (ProfileStore / DataService) with robops
#
#   • Every night at 02:17 UTC (04:17 Paris time in summer, 03:17 in winter)
#   • On demand: Actions tab → "Player Backup" → Run workflow
#
#  The file is kept for 30 days in the "Artifacts" section of each run.
#  It is only visible to people who have access to this (private) repository.
#
#  Prerequisite: this repository's ROBLOX_API_KEY secret, which must also have, for
#  universe-datastores, the permission to list keys and read entries.
#
#  "uses:": YOUR-ACCOUNT/robops/backup@main if robops lives in its own repository,
#  ./tools/robops/backup if the robops folder is copied into this repository.
# ─────────────────────────────────────────────────────────────────────────────
name: Player Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Production backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./tools/robops/backup
        with:
          environment: production
          api-key: ${{ secrets.ROBLOX_API_KEY_PRODUCTION || secrets.ROBLOX_API_KEY }}
          retention-days: "30"
