# ─────────────────────────────────────────────────────────────────────────────
#  Roblox deployment with robops — works with a private repository and a free GitHub account
#
#   • Pull request     → build + checks (dry-run), nothing is published
#   • Push to main     → build + checks (dry-run), nothing is published
#   • Push to develop  → automatic publish to the TEST game (staging)
#   • "Run workflow" button (Actions tab) → publish to the LIVE game
#
#  The live game therefore never updates on its own: you are the one who clicks.
#
#  The robops action is loaded from the "uses:" lines below:
#    • YOUR-ACCOUNT/robops@main  → robops lives in its own GitHub repository
#      (if it is private: in that robops repository, Settings → Actions → General →
#      Access → "Accessible from repositories owned by the user …")
#    • ./tools/robops            → the robops folder is copied into this game repository
#
#  Prerequisite: a ROBLOX_API_KEY repository secret
#  (Settings → Secrets and variables → Actions → New repository secret).
#  Optional: ROBLOX_API_KEY_PRODUCTION to use a different key in production.
# ─────────────────────────────────────────────────────────────────────────────
name: Roblox Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to publish
        type: choice
        options: [production, staging]
        default: production
      version_type:
        description: Version type
        type: choice
        options: [Published, Saved]
        default: Published
      with_datastores:
        description: Also overwrite the configured DataStores
        type: boolean
        default: false
      restart:
        description: Restart the servers
        type: choice
        options: [per config, yes, no]
        default: per config

permissions:
  contents: read

jobs:
  # ── Verification: builds and checks the config, publishes nothing ───────────
  verify:
    name: Build and checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@v0.2.1   # installs Rojo from rokit.toml
      - uses: ./tools/robops                  # path of the robops folder in this repository
        with:
          environment: production
          dry-run: true
      - name: How to publish
        if: github.event_name == 'push'
        run: |
          {
            echo "### ✅ Build OK — nothing has been published yet"
            echo ""
            echo "To update the live game: **Actions** tab → **Roblox Deploy**"
            echo "→ **Run workflow** → branch \`main\` → **production** → **Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Choosing the target for a publish ────────────────────────────────────────
  target:
    name: Choose the target
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then env_name="$INPUT_ENV"; else env_name="staging"; fi
          if [ "$env_name" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The live game can only be published from the main branch. In \"Use workflow from\", pick main."
            exit 1
          fi
          echo "environment=$env_name" >> "$GITHUB_OUTPUT"
          echo "Target: $env_name"

  # ── Publishing ───────────────────────────────────────────────────────────────
  deploy:
    name: Publish ${{ needs.target.outputs.environment }}
    needs: target
    runs-on: ubuntu-latest
    concurrency:
      group: roblox-deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false        # never cut off a publish that is in progress
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@v0.2.1

      - id: robops
        uses: ./tools/robops
        with:
          environment: ${{ needs.target.outputs.environment }}
          # Dedicated production key if it exists, otherwise ROBLOX_API_KEY.
          api-key: ${{ needs.target.outputs.environment == 'production' && secrets.ROBLOX_API_KEY_PRODUCTION || secrets.ROBLOX_API_KEY }}
          version-type: ${{ inputs.version_type }}
          with-datastores: ${{ inputs.with_datastores }}
          restart: ${{ inputs.restart == 'yes' && 'true' || (inputs.restart == 'no' && 'false' || '') }}

      # Keeps the published file: to roll back, re-run this workflow
      # on a previous commit (or publish the artifact with `robops publish`).
      - uses: actions/upload-artifact@v7
        with:
          name: place-${{ needs.target.outputs.environment }}-${{ github.sha }}
          path: build/
          retention-days: 30
          if-no-files-found: ignore
