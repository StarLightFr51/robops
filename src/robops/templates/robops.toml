# ─────────────────────────────────────────────────────────────────────────────
#  robops — Roblox deployment configuration (Open Cloud)
#
#  Where to find the IDs: Creator Dashboard → your experience
#    • universe_id: "⋯" menu on the thumbnail → "Copy Universe ID"
#    • place_id   : Places tab → click the place → ID in the URL
#
#  Any text value can read an environment variable:
#    universe_id = "${ROBLOX_UNIVERSE_ID}"          (required)
#    universe_id = "${ROBLOX_UNIVERSE_ID:-123456}"  (with a default value)
# ─────────────────────────────────────────────────────────────────────────────

# Environment variable that holds the API key (GitHub secret with the same name).
api_key_env = "ROBLOX_API_KEY"

[players]
# Where player profiles are stored (`robops player …` commands).
# Default values of DataService (leifstout) / ProfileStore. If you pass
# profileStoreIndex or profileStoreDataPrefix to DataService:init, copy them here.
datastore = "Default"           # = profileStoreIndex
key_prefix = "PLAYER_"          # = profileStoreDataPrefix (key = PLAYER_<UserId>)
# scope = "global"              # ProfileStore's default scope, only change it if you know why

[build]
# Run before each deployment. Remove this section if you commit
# your .rbxl / .rbxlx file directly in the repository.
command = "rojo build default.project.json --output build/game.rbxl"


# ═══════════════════════════════ STAGING ═════════════════════════════════════
[environments.staging]
universe_id = 0                 # ← replace
version_type = "Published"      # "Saved" = saved without being played by players
restart_servers = true          # immediately switches servers to the new version

[[environments.staging.places]]
name = "main"
place_id = 0                    # ← replace
file = "build/game.rbxl"
# Optional metadata (updated after publishing):
display_name = "My game [STAGING]"
# description = "Test version"
# server_size = 10

# Several places? Add one block per place:
# [[environments.staging.places]]
# name = "lobby"
# place_id = 0
# file = "build/lobby.rbxl"


# ══════════════════════════════ PRODUCTION ═══════════════════════════════════
[environments.production]
universe_id = 0                 # ← replace
version_type = "Published"
restart_servers = false         # existing servers finish their game

[[environments.production.places]]
name = "main"
place_id = 0                    # ← replace
file = "build/game.rbxl"

# Data overwritten ONLY with `robops deploy production --with-datastores`.
# The JSON file is an object { "key": value, ... }; each key is overwritten.
# A DataStores snapshot is taken beforehand (versioned backup kept for 30 days).
# [[environments.production.datastores]]
# name = "GameConfig"
# scope = "global"              # optional
# file = "data/config.production.json"
