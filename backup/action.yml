name: robops — player backup
description: Backs up all player profiles (ProfileStore / DataService) and keeps them as a private artifact.
author: robops

# Usage (in the game repository):
#   - uses: YOUR-ACCOUNT/robops/backup@v1.3.0
#     with:
#       environment: production
#       api-key: ${{ secrets.ROBLOX_API_KEY }}
#       age-recipient: ${{ vars.BACKUP_AGE_RECIPIENT }}   # optional: encrypts the backup
#
# The key must have, for universe-datastores, the permission to list keys and read entries.

inputs:
  environment:
    description: robops.toml environment to back up
    required: false
    default: production
  api-key:
    description: Open Cloud API key (pass a secret)
    required: true
  config:
    description: Path of the configuration file
    required: false
    default: robops.toml
  retention-days:
    description: Number of days the backup is kept on GitHub
    required: false
    default: "30"
  age-recipient:
    description: >-
      Optional age public key (age1…). When set, the backup is encrypted with it before
      being uploaded and only the encrypted file is kept. Decrypt with:
      age -d -i key.txt players-….json.gz.age > players-….json.gz (Linux runner required).
    required: false
    default: ""
  python-version:
    description: Python version to use (3.11 minimum)
    required: false
    default: "3.12"

outputs:
  file:
    description: Name of the backup file
    value: ${{ steps.encrypt.outputs.name || steps.backup.outputs.name }}
  count:
    description: Number of profiles backed up
    value: ${{ steps.backup.outputs.backup_count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install robops
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH/.."

    - name: Back up the players
      id: backup
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.api-key }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        name="players-${IN_ENVIRONMENT}-$(date -u +%Y-%m-%d_%H%M)Z.json.gz"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        robops player backup --env "$IN_ENVIRONMENT" --config "$IN_CONFIG" --out "robops-backup/$name"

    # Player data is personal data: with age-recipient, only the encrypted file leaves the runner.
    - name: Encrypt the backup
      id: encrypt
      if: (success() || failure()) && inputs.age-recipient != '' && steps.backup.outputs.name != ''
      shell: bash
      env:
        RECIPIENT: ${{ inputs.age-recipient }}
        NAME: ${{ steps.backup.outputs.name }}
      run: |
        set -euo pipefail
        file="robops-backup/$NAME"
        [ -f "$file" ] || exit 0
        if ! command -v age > /dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq age > /dev/null
        fi
        age --encrypt --recipient "$RECIPIENT" --output "$file.age" "$file"
        rm -f "$file"
        echo "name=$NAME.age" >> "$GITHUB_OUTPUT"

    # Uploaded even if a few profiles could not be read (they are listed in the file).
    - name: Keep the backup
      if: (success() || failure()) && steps.backup.outputs.name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.encrypt.outputs.name || steps.backup.outputs.name }}
        # With encryption requested, never fall back to the plain file.
        path: robops-backup/${{ steps.backup.outputs.name }}${{ inputs.age-recipient != '' && '.age' || '' }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0          # already compressed as .gz
        if-no-files-found: ignore

    - name: Summary
      if: success() || failure()
      shell: bash
      env:
        COUNT: ${{ steps.backup.outputs.backup_count }}
        NAME: ${{ steps.encrypt.outputs.name || steps.backup.outputs.name }}
        DAYS: ${{ inputs.retention-days }}
      run: |
        if [ -n "${COUNT:-}" ]; then
          {
            echo "### 💾 Player backup"
            echo ""
            echo "**${COUNT}** profile(s) saved to \`${NAME}\`, kept for ${DAYS} days."
            echo ""
            echo "To retrieve it: **Artifacts** section at the bottom of this page → download."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
