name: robops — player backup
description: Backs up all player profiles (ProfileStore / DataService) and keeps them as a private artifact.
author: robops

# Usage (in the game repository):
#   - uses: YOUR-ACCOUNT/robops/backup@main
#     with:
#       environment: production
#       api-key: ${{ secrets.ROBLOX_API_KEY }}
#
# The key must have, for universe-datastores, the permission to list keys and read entries.

inputs:
  environment:
    description: robops.toml environment to back up
    required: false
    default: production
  api-key:
    description: Open Cloud API key (pass a secret)
    required: true
  config:
    description: Path of the configuration file
    required: false
    default: robops.toml
  retention-days:
    description: Number of days the backup is kept on GitHub
    required: false
    default: "30"
  python-version:
    description: Python version to use (3.11 minimum)
    required: false
    default: "3.12"

outputs:
  file:
    description: Name of the backup file
    value: ${{ steps.backup.outputs.name }}
  count:
    description: Number of profiles backed up
    value: ${{ steps.backup.outputs.backup_count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install robops
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH/.."

    - name: Back up the players
      id: backup
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.api-key }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        name="players-${IN_ENVIRONMENT}-$(date -u +%Y-%m-%d_%H%M)Z.json.gz"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        robops player backup --env "$IN_ENVIRONMENT" --config "$IN_CONFIG" --out "robops-backup/$name"

    # Uploaded even if a few profiles could not be read (they are listed in the file).
    - name: Keep the backup
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.backup.outputs.name }}
        path: robops-backup/${{ steps.backup.outputs.name }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0          # already compressed as .gz
        if-no-files-found: ignore

    - name: Summary
      if: success() || failure()
      shell: bash
      env:
        COUNT: ${{ steps.backup.outputs.backup_count }}
        NAME: ${{ steps.backup.outputs.name }}
        DAYS: ${{ inputs.retention-days }}
      run: |
        if [ -n "${COUNT:-}" ]; then
          {
            echo "### 💾 Player backup"
            echo ""
            echo "**${COUNT}** profile(s) saved to \`${NAME}\`, kept for ${DAYS} days."
            echo ""
            echo "To retrieve it: **Artifacts** section at the bottom of this page → download."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
