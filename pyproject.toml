[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robops"
dynamic = ["version"]
description = "Roblox DevOps CLI: publishes places and overwrites an experience's data via Open Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["roblox", "open-cloud", "devops", "github-actions", "rojo"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.scripts]
robops = "robops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "robops.__version__" }

[tool.setuptools.package-data]
robops = ["templates/*", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "BLE", "I"]
ignore = ["E501", "E702"]   # long messages and "p.add_argument(...); p.add_argument(...)" are intentional

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[tool.ruff.lint.isort]
known-first-party = ["robops"]
known-local-folder = ["conftest", "test_updater", "test_players", "dashboard_fakes"]
