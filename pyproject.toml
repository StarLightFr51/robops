[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robops"
dynamic = ["version"]
description = "Roblox DevOps CLI: publishes places and overwrites an experience's data via Open Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]
license = { text = "MIT" }
keywords = ["roblox", "open-cloud", "devops", "github-actions", "rojo"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robops = "robops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "robops.__version__" }

[tool.setuptools.package-data]
robops = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
