# ─────────────────────────────────────────────────────────────────────────────
#  Compilation et publication de robops.exe / robops-setup.exe
#
#  Méthode simple (bouton) :
#    onglet Actions → « Release » → Run workflow → branche main → Run workflow.
#    La version publiée est celle de __version__ dans src/robops/__init__.py.
#
#  Méthode git (équivalente) :
#    git tag v1.2.0 && git push origin v1.2.0   (le tag doit égaler __version__)
#
#  Pour une nouvelle version : augmente __version__, commit, push, puis relance.
#  Les PC équipés se mettent à jour tout seuls dans les 24 h.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # nécessaire pour créer la release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Déterminer la version à publier
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/robops/__init__.py').read_text()).group(1))")
          tag="v$version"
          echo "version du code : $version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à __version__ = \"$version\" (attendu : $tag)."
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Lance la release depuis la branche main (« Use workflow from » → main)."
              exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::La version $version est déjà publiée. Augmente __version__ dans src/robops/__init__.py (ex. 1.1.1), commit, push, puis relance."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check . "pyinstaller==6.*"

      - name: Compiler les exécutables
        run: python exe/build.py --repo "$GITHUB_REPOSITORY"

      - name: Tester les exécutables
        env:
          ROBOPS_NO_UPDATE: "1"
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./dist/robops.exe --version | tee version.txt
          grep -q "${TAG#v}" version.txt
          mkdir smoke && cd smoke
          ../dist/robops.exe init
          test -f robops.toml && test -f .github/workflows/roblox-deploy.yml
          ../dist/robops.exe check || true        # le modèle exige des IDs : on vérifie juste que ça tourne
          ../dist/robops-setup.exe --help
          cd .. && cat dist/SHA256SUMS.txt

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Avec le bouton, le tag n'existe pas encore : gh le crée sur ce commit.
          gh release create "$TAG" \
            dist/robops.exe dist/robops-setup.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "robops $TAG" \
            --generate-notes
          {
            echo "### 🎉 robops $TAG publié"
            echo ""
            echo "Télécharge **robops-setup.exe** depuis la page *Releases* du dépôt."
          } >> "$GITHUB_STEP_SUMMARY"
