# ─────────────────────────────────────────────────────────────────────────────
#  Compiling and publishing robops.exe / robops-setup.exe
#
#  Simple method (button):
#    Actions tab → "Release" → Run workflow → branch main → Run workflow.
#    The published version is __version__ in src/robops/__init__.py.
#
#  Git method (equivalent):
#    git tag v1.2.0 && git push origin v1.2.0   (the tag must equal __version__)
#
#  For a new version: bump __version__, commit, push, then run again.
#  Equipped PCs update themselves within 24 h.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Determine the version to publish
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/robops/__init__.py').read_text()).group(1))")
          tag="v$version"
          echo "code version: $version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match __version__ = \"$version\" (expected: $tag)."
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release from the main branch (\"Use workflow from\" → main)."
              exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::Version $version is already published. Bump __version__ in src/robops/__init__.py (e.g. 1.1.1), commit, push, then run again."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==6.*"

      - name: Compile the executables
        run: python exe/build.py

      - name: Test the executables
        env:
          ROBOPS_NO_UPDATE: "1"
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./dist/robops.exe --version | tee version.txt
          grep -q "${TAG#v}" version.txt
          mkdir smoke && cd smoke
          ../dist/robops.exe init
          test -f robops.toml && test -f .github/workflows/roblox-deploy.yml
          ../dist/robops.exe check || true        # the template requires IDs: we only check that it runs
          ../dist/robops-setup.exe --help
          cd .. && cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # With the button, the tag does not exist yet: gh creates it on this commit.
          gh release create "$TAG" \
            dist/robops.exe dist/robops-setup.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "robops $TAG" \
            --generate-notes
          {
            echo "### 🎉 robops $TAG published"
            echo ""
            echo "Download **robops-setup.exe** from the repository's *Releases* page."
          } >> "$GITHUB_STEP_SUMMARY"
