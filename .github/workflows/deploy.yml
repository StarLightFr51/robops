name: "Roblox CI/CD"

on:
  pull_request:
    branches:
      - "main"

  push:
    branches:
      - "main"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Install tools from rokit.toml
        run: rokit install

      - name: Trust and install Rojo
        run: |
          rokit add rojo-rbx/rojo
          rokit install

      - name: Verify Rojo
        run: rojo -v

      - name: Build Roblox place
        run: |
          mkdir -p build
          rojo build default.project.json -o "build/game.rbxlx"
          test -s "build/game.rbxlx"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-place
          path: "build/game.rbxlx"
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: "production"

    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          cargo install rojo --version "7.4.4" --locked

      - name: Build release
        run: |
          mkdir -p build
          rojo build default.project.json -o "build/game.rbxlx"
          test -s "build/game.rbxlx"

      - name: Publish to Roblox
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: |
          set -euo pipefail

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $API_KEY" \
            --header "Content-Type: application/xml" \
            --data-binary @"build/game.rbxlx")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Publication failed: HTTP $status"
            cat "$response"
            exit 1
          fi

          echo "Publication successful"
          cat "$response"
